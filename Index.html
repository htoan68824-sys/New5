
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Responsive Image Gallery</h2>
    <p>Resize the browser window to see the effect.</p>

    <div class="gallery-container">

        <div class="responsive">
            <div class="gallery">
                <img src="https://www.w3schools.com/css/img_5terre.jpg"
                     alt="Cinque Terre">
                <div class="description">
                    Cinque Terre
                </div>
            </div>
        </div>

        <div class="responsive">
            <div class="gallery">
                <img src="https://www.w3schools.com/css/img_forest.jpg"
                     alt="Forest">
                <div class="description">
                    Green Forest
                </div>
            </div>
        </div>

        <div class="responsive">
            <div class="gallery">
                <img src="https://www.w3schools.com/css/img_lights.jpg"
                     alt="Northern Lights">
                <div class="description">
                    Northern Lights
                </div>
            </div>
        </div>

        <div class="responsive">
            <div class="gallery">
                <img src="https://www.w3schools.com/css/img_mountains.jpg"
                     alt="Mountains">
                <div class="description">
                    Beautiful Mountains
                </div>
            </div>
        </div>

    </div>

</body>
</html>
